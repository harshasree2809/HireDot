spring.application.name=hiredot-backend
server.port=8080

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=hiredot

# JWT
app.jwt.secret=${JWT_SECRET:YOUR_DEFAULT_JWT_SECRET_KEY_MUST_BE_LONG_ENOUGH}
app.jwt.expiration=86400000

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your-cloud-name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your-api-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your-api-secret}

# Google Gemini AI (Free - ~1500 requests/day)
# gemini-1.5-flash is shut down — model is hardcoded to gemini-2.5-flash in GeminiService
gemini.api.key=${GEMINI_API_KEY:your-gemini-api-key}

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.hiredot=DEBUG

# Error Handling
server.error.include-message=always
